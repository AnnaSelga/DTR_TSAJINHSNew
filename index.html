<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taysansan Jose INHS • DTR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:linear-gradient(160deg,#08203e,#0b2a56);
  color:#fff;min-height:100vh
}
.screen{display:none;min-height:100vh}
.screen.active{display:flex}
.center{align-items:center;justify-content:center;text-align:center}
.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  padding:2rem;max-width:420px;width:100%
}
h1{font-size:1.5rem;margin-bottom:.4rem}
h2{font-size:1.2rem;margin-bottom:.4rem}
p{font-size:.85rem;opacity:.75}
.btn{
  padding:.8rem 1rem;border:none;border-radius:12px;
  cursor:pointer;font-weight:700
}
.btn-main{background:#22c55e;color:#083344}
.btn-sec{background:#2563eb;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
input{
  width:100%;padding:.7rem;border-radius:10px;border:none;
  margin:.4rem 0;font-size:.9rem
}
.home-menu{display:grid;gap:1rem;margin-top:2rem}
.clock{font-size:2.3rem;font-weight:800;margin-top:.5rem}
.error{color:#fca5a5;font-size:.8rem;margin-top:.4rem}
</style>
</head>

<body>

<!-- ================= HOME ================= -->
<div id="screen-home" class="screen active center">
  <div class="card">
    🏫
    <h1 id="schoolName">TAYSANSAN JOSE INTEGRATED NATIONAL HIGH SCHOOL</h1>
    <p>Daily Time Record System</p>
    <div class="clock" id="clock">00:00:00</div>

    <div class="home-menu">
      <button class="btn btn-main" onclick="goGate()">📺 Gate Display</button>
      <button class="btn btn-sec" onclick="goSignup()">✍️ Teacher Sign‑Up</button>
      <button class="btn btn-sec" onclick="goAdmin()">🔐 Admin Panel</button>
    </div>
  </div>
</div>

<!-- ================= GATE ================= -->
<div id="screen-gate" class="screen center">
  <div class="card">
    <h2>Gate QR</h2>
    <div id="qr"></div>
    <p id="gateCode"></p>
    <button class="btn btn-sec" onclick="goHome()">← Back</button>
  </div>
</div>

<!-- ================= SIGNUP ================= -->
<div id="screen-signup" class="screen center">
  <div class="card">
    <h2>Teacher Registration</h2>
    <input id="su-name" placeholder="Full Name">
    <input id="su-id" placeholder="Employee ID">
    <button class="btn btn-main" onclick="signup()">Submit</button>
    <button class="btn btn-sec" onclick="goHome()">← Back</button>
    <p class="error" id="suErr"></p>
  </div>
</div>

<!-- ================= CHECKIN ================= -->
<div id="screen-checkin" class="screen center">
  <div class="card">
    <h2>Teacher Sign‑In</h2>
    <input id="ci-id" placeholder="Employee ID">
    <input id="ci-pin" placeholder="PIN" type="password">
    <button class="btn btn-main" onclick="submitCheckin()">Login</button>
    <p class="error" id="ciErr"></p>
  </div>
</div>

<!-- ================= ADMIN ================= -->
<div id="screen-admin" class="screen center">
  <div class="card">
    <h2>Admin Login</h2>
    <input id="adminPw" placeholder="Password" type="password">
    <button class="btn btn-main" onclick="adminLogin()">Enter</button>
    <button class="btn btn-sec" onclick="goHome()">← Back</button>
    <p class="error" id="adminErr"></p>
  </div>
</div>

<script>
// ================== SETTINGS ==================
const SCHOOL_LAT = 13.88356566449263;     // ← PALITAN
const SCHOOL_LNG = 121.09863694028769;    // ← PALITAN
const ALLOWED_RADIUS = 100;      // meters
const ADMIN_PASSWORD = "admin123";

// ================== DATA ==================
let teachers = JSON.parse(localStorage.getItem("dtr_teachers")||"[]");
let records  = JSON.parse(localStorage.getItem("dtr_records")||"[]");

function save(){
  localStorage.setItem("dtr_teachers",JSON.stringify(teachers));
  localStorage.setItem("dtr_records",JSON.stringify(records));
}

// ================== CLOCK ==================
setInterval(()=>{
  clock.textContent = new Date().toLocaleTimeString("en-PH")
},1000);

// ================== NAV ==================
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
const goHome=()=>show("screen-home");
const goGate=()=>{
  show("screen-gate");
  createQR();
};
const goSignup=()=>show("screen-signup");
const goAdmin=()=>show("screen-admin");

// ================== QR ==================
function dailyCode(){
  return new Date().toISOString().slice(0,10);
}
function createQR(){
  qr.innerHTML="";
  const link = location.origin + location.pathname + "?checkin="+dailyCode();
  new QRCode(qr,{text:link,width:220,height:220});
  gateCode.textContent="Code: "+dailyCode();
}

// ================== GPS ==================
function distance(lat1,lng1,lat2,lng2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
            Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ================== CHECKIN ==================
function submitCheckin(){
  ciErr.textContent="📍 Checking GPS...";
  if(!navigator.geolocation){
    ciErr.textContent="GPS not supported.";return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    const d=distance(SCHOOL_LAT,SCHOOL_LNG,pos.coords.latitude,pos.coords.longitude);
    if(d>ALLOWED_RADIUS){
      ciErr.textContent="Outside school area ("+Math.round(d)+"m)";
      return;
    }
    ciErr.textContent="✅ Attendance logged";
    records.push({
      id:ci-id.value,
      time:new Date().toLocaleString(),
      distance:Math.round(d)
    });
    save();
  },()=>{
    ciErr.textContent="Location permission required.";
  },{enableHighAccuracy:true});
}

// ================== SIGNUP ==================
function signup(){
  if(!su-name.value||!su-id.value){
    suErr.textContent="All fields required";return;
  }
  teachers.push({name:su-name.value,id:su-id.value});
  save();
  suErr.textContent="✅ Submitted for admin approval";
}

// ================== ADMIN ==================
function adminLogin(){
  if(adminPw.value===ADMIN_PASSWORD){
    alert("Admin logged in (demo)");
    goHome();
  }else adminErr.textContent="Invalid password";
}

// ================== AUTO OPEN CHECKIN VIA QR ==================
if(location.search.includes("checkin")){
  show("screen-checkin");
}
</script>

</body>
</html>
``
