<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Teacher DTR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0ede8;--navy:#1a2d4a;--blue:#1a4a7a;--blue2:#2563eb;
  --orange:#e85d04;--orange2:#f97316;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;
  --surface:#fff;--border:#e5e0d8;--muted:#6b7280;--text:#111827;
  --radius:16px;
}
html,body{min-height:100%;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text)}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* LOGIN */
#screen-login{background:linear-gradient(160deg,#0d2137,#1a3a6b 60%,#0f2144);align-items:center;justify-content:center;padding:1.5rem}
.login-box{background:#fff;border-radius:22px;padding:2rem 1.75rem;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.login-school{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.5rem;text-align:center}
.login-title{font-size:1.3rem;font-weight:800;color:var(--navy);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px}
.login-sub{font-size:.75rem;color:var(--muted);text-align:center;margin-bottom:1.25rem}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:.875rem}
.field label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.field input{padding:.65rem .85rem;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;font-weight:600;outline:none;transition:border-color .2s;color:var(--text);width:100%}
.field input:focus{border-color:var(--blue2)}
.pin-dots{display:flex;justify-content:center;gap:.55rem;margin:.6rem 0 .2rem}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .15s}
.pin-dot.filled{background:var(--navy);border-color:var(--navy)}
.pin-dot.err{background:var(--red);border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin:.5rem 0}
.pkey{padding:.85rem;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:1.2rem;font-weight:700;cursor:pointer;transition:all .12s;color:var(--text);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.pkey .sub{font-size:.4rem;letter-spacing:.1rem;color:var(--muted);font-weight:600;margin-top:2px}
.pkey:active{transform:scale(.93);background:#dbeafe;border-color:var(--blue2)}
.pkey.pzero{grid-column:2}
.pkey.pdel{font-size:.95rem;color:var(--muted)}
.err-msg{color:var(--red);font-size:.75rem;text-align:center;min-height:1rem;font-weight:600;margin:.2rem 0}
.login-btn{width:100%;padding:.9rem;border:none;border-radius:11px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-size:1rem;font-weight:800;cursor:pointer;margin-top:.5rem}
.login-btn:active{transform:scale(.98)}
.login-hint{font-size:.67rem;color:var(--muted);text-align:center;margin-top:.6rem}

/* DASHBOARD */
#screen-dash{background:var(--bg)}
.dash-top{text-align:center;padding:2rem 1.5rem 1.25rem}
.dash-clock{font-size:3.5rem;font-weight:900;color:var(--navy);letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
.dash-date{font-size:.85rem;color:var(--muted);margin-top:4px;font-weight:500}
.dash-card{background:#fff;border-radius:var(--radius);margin:0 1rem 1rem;padding:1.25rem;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.dash-greeting{font-size:1.2rem;font-weight:800;color:var(--navy);margin-bottom:4px}
.dash-user{font-size:.85rem;color:var(--muted);margin-bottom:1.1rem;font-weight:500}

/* TABS */
.tabs{display:flex;background:#f5f2ee;border-radius:10px;padding:3px;gap:2px;margin-bottom:1.1rem}
.tab-btn{flex:1;padding:.5rem .4rem;border:none;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:4px}
.tab-btn.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* STATUS */
.status-bar{display:flex;align-items:center;justify-content:space-between;background:#f5f2ee;border-radius:10px;padding:.75rem 1rem;margin-bottom:.875rem}
.status-left{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.status-dot.in{background:var(--green)}
.status-dot.out{background:var(--red)}
.status-dot.none{background:#d1d5db}
.status-time{font-size:.95rem;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums}

/* SCAN AREA */
.scan-area{border:2px dashed #d1ccc4;border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:.875rem;overflow:hidden}
.scan-idle{color:var(--muted);font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.scan-idle .si{font-size:1.5rem}
#qr-reader{width:100%}
#qr-reader video{border-radius:8px;width:100%}

.scan-btn{width:100%;padding:.95rem;border:none;border-radius:11px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-size:1rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:.75rem}
.scan-btn:active{transform:scale(.98)}
.scan-btn.stop{background:linear-gradient(135deg,#dc2626,#ef4444)}

.manual-wrap{display:flex;flex-direction:column;gap:.4rem}
.manual-lbl{font-size:.72rem;color:var(--muted);text-align:center}
.manual-row{display:flex;gap:.5rem}
.manual-input{flex:1;padding:.6rem .85rem;border:1.5px solid var(--border);border-radius:9px;font-size:.9rem;font-weight:700;outline:none;letter-spacing:.1rem;text-transform:uppercase;transition:border-color .2s}
.manual-input:focus{border-color:var(--orange)}
.submit-btn{padding:.6rem 1.1rem;border:none;border-radius:9px;background:var(--orange);color:#fff;font-size:.85rem;font-weight:800;cursor:pointer}

/* RESULT */
.attend-result{display:none;text-align:center;padding:1rem 0;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.r-icon{font-size:4rem;display:block;margin-bottom:.5rem}
.r-action{font-size:1.75rem;font-weight:900;margin-bottom:4px}
.r-action.in{color:var(--green)}.r-action.out{color:var(--red)}
.r-time{font-size:2rem;font-weight:800;color:var(--navy);margin-bottom:.25rem}
.r-sub{font-size:.75rem;color:var(--muted)}
.r-back{margin-top:1rem;background:none;border:1.5px solid var(--border);border-radius:9px;padding:.55rem 1.25rem;cursor:pointer;font-size:.82rem;color:var(--muted);font-weight:600;width:100%}

/* HISTORY */
.history-empty{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem}
.hist-item{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--border)}
.hist-date{font-size:.82rem;font-weight:600}.hist-meta{font-size:.7rem;color:var(--muted)}
.hist-in{color:var(--green);font-size:.78rem;font-weight:700}
.hist-out{color:var(--red);font-size:.78rem;font-weight:700}
.hist-hours{font-size:.7rem;color:var(--muted)}

/* SETTINGS */
.settings-lbl{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem}
.cpf{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.cpf input{padding:.6rem .85rem;border:1.5px solid var(--border);border-radius:9px;font-size:.9rem;outline:none;transition:border-color .2s}
.cpf input:focus{border-color:var(--orange)}
.save-btn{padding:.65rem 1.25rem;border:none;border-radius:9px;background:var(--green);color:#fff;font-size:.85rem;font-weight:700;cursor:pointer}
.logout-btn{width:100%;padding:.75rem;border:1.5px solid #fca5a5;border-radius:10px;background:none;color:var(--red);font-size:.85rem;font-weight:700;cursor:pointer;margin-top:.75rem}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(8px);background:#111;color:#fff;padding:.65rem 1.25rem;border-radius:50px;font-size:.82rem;font-weight:600;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="screen-login">
  <div class="login-box">
    <div class="login-school" id="login-school-lbl">School DTR</div>
    <div class="login-title">👤 Employee Login</div>
    <div class="login-sub" id="login-date-lbl"></div>
    <div style="height:.75rem"></div>
    <div class="field">
      <label>Employee ID</label>
      <input type="text" id="emp-id" placeholder="e.g. T-2024-001" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label>PIN Code</label>
      <div class="pin-dots">
        <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
        <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
      </div>
      <div class="pin-pad">
        <button class="pkey" onclick="pp('1')">1<span class="sub"></span></button>
        <button class="pkey" onclick="pp('2')">2<span class="sub">ABC</span></button>
        <button class="pkey" onclick="pp('3')">3<span class="sub">DEF</span></button>
        <button class="pkey" onclick="pp('4')">4<span class="sub">GHI</span></button>
        <button class="pkey" onclick="pp('5')">5<span class="sub">JKL</span></button>
        <button class="pkey" onclick="pp('6')">6<span class="sub">MNO</span></button>
        <button class="pkey" onclick="pp('7')">7<span class="sub">PQRS</span></button>
        <button class="pkey" onclick="pp('8')">8<span class="sub">TUV</span></button>
        <button class="pkey" onclick="pp('9')">9<span class="sub">WXYZ</span></button>
        <button class="pkey pzero" onclick="pp('0')">0</button>
        <button class="pkey pdel" onclick="pd()">⌫</button>
      </div>
    </div>
    <div class="err-msg" id="login-err"></div>
    <button class="login-btn" onclick="doLogin()">Login ➤</button>
    <div class="login-hint">First time? Default PIN is <strong>1234</strong></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="screen" id="screen-dash">
  <div class="dash-top">
    <div class="dash-clock" id="dash-clock">12:00:00 AM</div>
    <div class="dash-date" id="dash-date"></div>
  </div>
  <div class="dash-card">
    <div class="dash-greeting" id="dash-greeting">Good morning!</div>
    <div class="dash-user" id="dash-user">—</div>
    <div class="tabs">
      <button class="tab-btn active" id="tb-timein" onclick="switchTab('timein',this)">⏱️ Time In/Out</button>
      <button class="tab-btn" id="tb-history" onclick="switchTab('history',this)">📋 History</button>
      <button class="tab-btn" id="tb-settings" onclick="switchTab('settings',this)">⚙️ Settings</button>
    </div>

    <!-- TIME IN/OUT -->
    <div class="tab-panel active" id="panel-timein">
      <div class="status-bar">
        <div class="status-left"><div class="status-dot none" id="sdot"></div><span id="slbl">No record today</span></div>
        <div class="status-time" id="stime"></div>
      </div>
      <div class="attend-result" id="attend-result">
        <span class="r-icon" id="r-icon">🟢</span>
        <div class="r-action in" id="r-action">TIME IN</div>
        <div class="r-time" id="r-time">08:00 AM</div>
        <div class="r-sub" id="r-sub"></div>
        <button class="r-back" onclick="backToScan()">← Scan again</button>
      </div>
      <div id="scan-ui">
        <div class="scan-area" id="scan-area">
          <div class="scan-idle" id="scan-idle">
            <span class="si">📷</span>
            <span>Scan the QR code displayed at the school entrance</span>
          </div>
        </div>
        <button class="scan-btn" id="scan-btn" onclick="toggleScanner()">📷 Scan QR Code</button>
        <div class="manual-wrap">
          <div class="manual-lbl">Or enter QR code manually:</div>
          <div class="manual-row">
            <input type="text" class="manual-input" id="manual-code" placeholder="Enter today's code" maxlength="8" autocomplete="off" spellcheck="false">
            <button class="submit-btn" onclick="submitManual()">Submit</button>
          </div>
        </div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="tab-panel" id="panel-history">
      <div id="history-list"><div class="history-empty">No records yet.</div></div>
    </div>

    <!-- SETTINGS -->
    <div class="tab-panel" id="panel-settings">
      <div class="settings-lbl">Change PIN</div>
      <div class="cpf">
        <input type="password" id="s-p1" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN">
        <input type="password" id="s-p2" inputmode="numeric" maxlength="4" placeholder="Confirm new PIN">
        <button class="save-btn" onclick="savePin()">✅ Save PIN</button>
      </div>
      <button class="logout-btn" onclick="doLogout()">🚪 Log Out</button>
    </div>
  </div>
</div>

<!-- FULLSCREEN SCANNER OVERLAY -->
<div id="scanner-overlay" style="display:none;position:fixed;inset:0;background:#000;z-index:999;flex-direction:column;align-items:center;justify-content:center">
  <div style="color:#fff;font-size:.85rem;font-weight:600;margin-bottom:1rem;text-align:center;padding:0 1rem">
    📷 Point your camera at the QR code on the gate screen
  </div>
  <div id="qr-reader" style="width:100%;max-width:360px;border-radius:12px;overflow:hidden"></div>
  <button onclick="stopScanner()" style="margin-top:1.5rem;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;padding:.75rem 2rem;border-radius:50px;font-size:.9rem;font-weight:700;cursor:pointer">
    ✕ Cancel
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══ FIREBASE ═══════════════════════════════════════════════
const DB='https://schooldtr-b83bb-default-rtdb.firebaseio.com';
async function fbGet(path){
  try{const r=await fetch(DB+path+'.json');const d=await r.json();return d||(path.includes('settings')?{}:[]);}
  catch(e){return path.includes('settings')?{}:[];}
}
async function fbSet(path,data){
  try{await fetch(DB+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}
  catch(e){console.error(e);}
}
async function loadAll(){
  let [p,r,s,st]=await Promise.all([fbGet('/people'),fbGet('/records'),fbGet('/signups'),fbGet('/settings')]);
  people =Array.isArray(p)?p:Object.values(p||{});
  records=Array.isArray(r)?r:Object.values(r||{});
  signups=Array.isArray(s)?s:Object.values(s||{});
  settings=st&&st.school?st:{school:'School DTR',password:'admin123'};
}
async function saveRecs(){await fbSet('/records',records);}
async function savePpl() {await fbSet('/people', people);}

// ═══ DATA ═══════════════════════════════════════════════════
let people=[],records=[],signups=[],settings={school:'School DTR'};

function todayStr(){return new Date().toLocaleDateString('en-CA')}
function timeNow(){return new Date().toLocaleTimeString('en-PH',{hour12:true})}

function showLoad(m='Loading...'){
  let el=document.getElementById('fb-load');
  if(!el){el=document.createElement('div');el.id='fb-load';el.style.cssText='position:fixed;inset:0;background:rgba(13,33,55,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:.95rem;font-weight:600;gap:.75rem';document.body.appendChild(el);}
  el.innerHTML='<div style="font-size:2rem;animation:sp 1s linear infinite">⏳</div><div>'+m+'</div>';
  el.style.display='flex';
  if(!document.getElementById('sp-style')){const s=document.createElement('style');s.id='sp-style';s.textContent='@keyframes sp{to{transform:rotate(360deg)}}';document.head.appendChild(s);}
}
function hideLoad(){const el=document.getElementById('fb-load');if(el)el.style.display='none';}

// Init — load school name on page load
showLoad('Connecting...');
loadAll().then(()=>{
  hideLoad();
  document.getElementById('login-school-lbl').textContent=settings.school||'School DTR';
  document.getElementById('login-date-lbl').textContent=
    new Date().toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}).catch(()=>{hideLoad();});

// Clock
function tick(){
  const now=new Date();
  const c=document.getElementById('dash-clock');
  const d=document.getElementById('dash-date');
  if(c)c.textContent=now.toLocaleTimeString('en-PH',{hour12:true});
  if(d)d.textContent=now.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
setInterval(tick,1000);tick();

// PIN
let pinVal='',currentUser=null;
function pp(d){if(pinVal.length>=4)return;pinVal+=d;dots();if(pinVal.length===4)setTimeout(doLogin,200);}
function pd(){pinVal=pinVal.slice(0,-1);dots();}
function dots(e){for(let i=0;i<4;i++){const el=document.getElementById('pd'+i);el.className='pin-dot'+(i<pinVal.length?(e?' err':' filled'):'');}}
function clearErr(){document.getElementById('login-err').textContent='';}
function showErr(m){document.getElementById('login-err').textContent=m;dots(true);pinVal='';setTimeout(dots,600);}

// Login
async function doLogin(){
  showLoad('Verifying...');
  await loadAll();
  hideLoad();
  const id=document.getElementById('emp-id').value.trim();
  if(!id){showErr('Please enter your Employee ID.');return;}
  if(pinVal.length<4){showErr('Please enter your 4-digit PIN.');return;}
  if(signups.find(s=>s.id===id&&s.status==='pending')){showErr('Account pending admin approval.');return;}
  const person=people.find(p=>p.id===id);
  if(!person){showErr('Employee ID not found. Please register first.');return;}
  if(person.type==='student'){showErr('This portal is for Teachers & Staff only.');return;}
  if(pinVal!==(person.pin||'1234')){showErr('Incorrect PIN. Try again.');return;}
  currentUser=person;
  pinVal='';dots();
  showDashboard();
}

function showDashboard(){
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-dash').classList.add('active');
  const hr=new Date().getHours();
  document.getElementById('dash-greeting').textContent=hr<12?'Good morning!':hr<18?'Good afternoon!':'Good evening!';
  document.getElementById('dash-user').textContent=`${currentUser.name} (${currentUser.id})`;
  updateStatus();
}

function updateStatus(){
  const recs=records.filter(r=>r.date===todayStr()&&r.personId===currentUser.id);
  const last=recs[recs.length-1];
  const dot=document.getElementById('sdot'),lbl=document.getElementById('slbl'),st=document.getElementById('stime');
  if(!last){dot.className='status-dot none';lbl.textContent='No record today';st.textContent='';}
  else if(!last.timeOut){dot.className='status-dot in';lbl.textContent='Time In';st.textContent=last.timeIn;}
  else{dot.className='status-dot out';lbl.textContent='Time Out';st.textContent=last.timeOut;}
}

// Tabs
function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='history')renderHistory();
  if(name==='timein')updateStatus();
}

// Scanner
let scanner=null,scanning=false;
function toggleScanner(){scanning?stopScanner():startScanner();}
function startScanner(){
  const overlay=document.getElementById('scanner-overlay');
  overlay.style.display='flex';
  // Destroy previous instance if any
  if(scanner){try{scanner.clear();}catch(e){}}
  scanner=new Html5Qrcode('qr-reader');
  scanner.start(
    {facingMode:'environment'},
    {fps:10,qrbox:{width:250,height:250}},
    onScan,
    ()=>{}
  ).then(()=>{
    scanning=true;
    document.getElementById('scan-btn').innerHTML='⏹ Stop Scanner';
    document.getElementById('scan-btn').classList.add('stop');
  }).catch(err=>{
    overlay.style.display='none';
    toast('❌ Camera not accessible. Please allow camera permission or use manual code.');
    console.error(err);
  });
}
function stopScanner(){
  const overlay=document.getElementById('scanner-overlay');
  overlay.style.display='none';
  if(scanner&&scanning){
    scanner.stop().then(()=>{scanner.clear();}).catch(()=>{});
  }
  scanning=false;
  document.getElementById('scan-btn').innerHTML='📷 Scan QR Code';
  document.getElementById('scan-btn').classList.remove('stop');
}
function onScan(text){
  stopScanner();
  let code=text;
  try{const u=new URL(text);code=u.searchParams.get('checkin')||text;}catch(e){}
  processCode(code.trim().toUpperCase());
}
function submitManual(){
  const code=document.getElementById('manual-code').value.trim().toUpperCase();
  if(!code){toast("⚠️ Enter today's code.");return;}
  processCode(code);
}

// Daily code (same algorithm as gate display)
function getDailyCode(){
  const d=todayStr(),seed=d.replace(/-/g,'');
  let hash=0;for(let i=0;i<seed.length;i++){hash=(hash<<5)-hash+seed.charCodeAt(i);hash|=0;}
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code='',h=Math.abs(hash);
  for(let i=0;i<6;i++){code+=chars[h%chars.length];h=Math.floor(h/chars.length)||Math.abs(hash*(i+7));}
  return code;
}

async function processCode(code){
  if(code!==getDailyCode()){toast("❌ Invalid or expired code. Scan today's QR code at the gate.");return;}
  showLoad('Recording attendance...');
  await loadAll();
  const t=todayStr();
  const recs=records.filter(r=>r.date===t&&r.personId===currentUser.id);
  const last=recs[recs.length-1];
  const isIn=!last||last.timeOut;
  const time=timeNow();
  if(isIn)records.push({date:t,personId:currentUser.id,name:currentUser.name,type:currentUser.type,section:currentUser.section||'',timeIn:time,timeOut:null,uid:Date.now()});
  else last.timeOut=time;
  await saveRecs();
  hideLoad();
  // Show result
  document.getElementById('scan-ui').style.display='none';
  const res=document.getElementById('attend-result');
  res.style.display='block';
  document.getElementById('r-icon').textContent=isIn?'🟢':'🔴';
  const act=document.getElementById('r-action');
  act.textContent=isIn?'TIME IN':'TIME OUT';act.className='r-action '+(isIn?'in':'out');
  document.getElementById('r-time').textContent=time;
  document.getElementById('r-sub').textContent=new Date().toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('manual-code').value='';
  updateStatus();
  toast(isIn?'✅ Time In recorded!':'👋 Time Out recorded!');
}

function backToScan(){
  document.getElementById('attend-result').style.display='none';
  document.getElementById('scan-ui').style.display='block';
  updateStatus();
}

// History
function calcHrs(ti,to){
  if(!ti||!to)return'';
  const p=t=>{const[tm,ap]=t.split(' ');let[h,m]=tm.split(':').map(Number);if(ap==='PM'&&h!==12)h+=12;if(ap==='AM'&&h===12)h=0;return h*60+m;};
  const d=p(to)-p(ti);return d>0?(d/60).toFixed(1)+' hrs':'';
}
async function renderHistory(){
  showLoad('Loading history...');
  await loadAll();
  hideLoad();
  const mine=records.filter(r=>r.personId===currentUser.id).sort((a,b)=>b.date.localeCompare(a.date));
  const wrap=document.getElementById('history-list');
  if(!mine.length){wrap.innerHTML='<div class="history-empty">No attendance records yet.</div>';return;}
  wrap.innerHTML=mine.slice(0,30).map(r=>`<div class="hist-item">
    <div><div class="hist-date">${new Date(r.date+'T12:00:00').toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</div><div class="hist-meta">${r.section||''}</div></div>
    <div style="text-align:right"><div class="hist-in">IN: ${r.timeIn}</div>${r.timeOut?`<div class="hist-out">OUT: ${r.timeOut}</div>`:'<div style="color:var(--muted);font-size:.7rem">Still in</div>'}<div class="hist-hours">${calcHrs(r.timeIn,r.timeOut)}</div></div>
  </div>`).join('');
}

// Settings
async function savePin(){
  const p1=document.getElementById('s-p1').value,p2=document.getElementById('s-p2').value;
  if(!/^\d{4}$/.test(p1)){toast('⚠️ PIN must be 4 digits.');return;}
  if(p1!==p2){toast('⚠️ PINs do not match.');return;}
  showLoad('Saving PIN...');
  await loadAll();
  const idx=people.findIndex(p=>p.uid===currentUser.uid);
  if(idx>=0){people[idx].pin=p1;currentUser=people[idx];await savePpl();}
  hideLoad();
  document.getElementById('s-p1').value='';document.getElementById('s-p2').value='';
  toast('✅ PIN changed!');
}
function doLogout(){
  stopScanner();currentUser=null;pinVal='';dots();
  document.getElementById('emp-id').value='';
  document.getElementById('screen-dash').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  backToScan();
  switchTab('timein',document.getElementById('tb-timein'));
}

// Toast
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
</script>
